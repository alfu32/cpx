target = "linux-x86_64"
os = "linux"
architecture = "x86_64"
vendor = "unknown"
abi = "system-v"
object_format = "elf"
endianness = "little"
pointer_bits = 64
word_bits = 64
c_integer_model = "lp64"
float_format = "binary32"
float_size = 4
float_alignment = 4
float_mant_dig = 24
float_min_exp = -125
float_max_exp = 128
double_format = "binary64"
double_size = 8
double_alignment = 8
double_mant_dig = 53
double_min_exp = -1021
double_max_exp = 1024
long_double_format = "x87-extended"
long_double_size = 16
long_double_alignment = 16
long_double_mant_dig = 64
long_double_min_exp = -16381
long_double_max_exp = 16384
stack_alignment = 16
symbol_prefix = ""
tls_model = "initial-exec"
linker = "ld"
startup_entry = "_start"
system_libraries = []
features = ["threads", "atomics", "syscalls", "int128", "c17_complex"]
intrinsics = ["syscall0", "syscall1", "syscall2", "syscall3", "syscall4", "syscall5", "syscall6"]
supported_abis = ["c", "system", "cplus", "intrinsic", "runtime"]
